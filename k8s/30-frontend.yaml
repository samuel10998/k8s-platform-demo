apiVersion: apps/v1
kind: Deployment
metadata: 
  name: frontend
  namespace: demo-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
       - name: frontend
         image: frontend:0.1.0
         imagePullPolicy: IfNotPresent
         ports:
          - containerPort: 8080
         resources:
           requests:
             cpu: 25m
             memory: 32Mi
           limits:
             cpu: 100m
             memory: 64Mi
         readinessProbe:
           httpGet: 
             path: /
             port: 8080
           periodSeconds: 5
         livenessProbe: 
           httpGet: 
             path: /
             port: 8080
           initialDelaySeconds: 10
           periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: demo-dev
spec:
  type: ClusterIP
  selector: 
    app: frontend
  ports:
   - port: 80
     targetPort: 8080


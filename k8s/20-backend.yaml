apiVersion: apps/v1
kind: Deployment
metadata: 
  name: backend
  namespace: demo-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
       - name: backend
         image: backend:0.1.0
         imagePullPolicy: IfNotPresent
         ports:
          - containerPort: 8000
         envFrom:
          - configMapRef:
              name: backend-config
          - secretRef:
              name: backend-secret
         resources:
           requests:
             cpu: 50m
             memory: 64Mi
           limits:
             cpu: 200m
             memory: 128Mi
         readinessProbe:
           httpGet: 
             path: /readyz
             port: 8000
           periodSeconds: 5
         livenessProbe: 
           httpGet: 
             path: /healthz
             port: 8000
           initialDelaySeconds: 10
           periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: demo-dev
spec:
  type: ClusterIP
  selector: 
    app: backend
  ports:
   - port: 80
     targetPort: 8000


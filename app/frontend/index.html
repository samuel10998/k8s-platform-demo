<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K8s demo</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1d232b; --muted: #5d6875;
      --accent: #2f6fde; --ok: #1f8a4c; --err: #c23a3a; --border: #dde2e8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14181d; --card: #1d232b; --text: #e8ecf0; --muted: #9aa5b1;
        --accent: #6a9cf0; --ok: #4cc27f; --err: #f07070; --border: #2e3640;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px;
    }
    main {
      width: 100%; max-width: 520px; background: var(--card);
      border: 1px solid var(--border); border-radius: 12px; padding: 24px;
    }
    h1 { font-size: 1.3rem; margin: 0 0 4px; }
    p.sub { margin: 0 0 20px; color: var(--muted); }
    button {
      font: inherit; padding: 10px 18px; border: 0; border-radius: 8px;
      background: var(--accent); color: #fff; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 20px 0 0; }
    dt { color: var(--muted); }
    dd { margin: 0; font-family: ui-monospace, Consolas, monospace; word-break: break-all; }
    .err { color: var(--err); margin-top: 20px; }
    .yes { color: var(--ok); }
    .no { color: var(--err); }
  </style>
</head>
<body>
  <main>
    <h1>Frontend beží</h1>
    <p class="sub">Tlačidlo zavolá backend cez <code>/api/hello</code>.</p>
    <button id="btn">Zavolaj backend</button>
    <div id="out"></div>
  </main>

  <script>
    const btn = document.getElementById("btn");
    const out = document.getElementById("out");

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      out.innerHTML = "";
      try {
        const res = await fetch("/api/hello", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const d = await res.json();
        const dl = document.createElement("dl");
        const rows = [
          ["Správa", d.message],
          ["Prostredie", d.environment],
          ["Pod", d.pod],
          ["Secret", d.secret_configured ? "nastavený" : "chýba"],
        ];
        for (const [k, v] of rows) {
          const dt = document.createElement("dt");
          const dd = document.createElement("dd");
          dt.textContent = k;
          dd.textContent = v;
          if (k === "Secret") dd.className = d.secret_configured ? "yes" : "no";
          dl.append(dt, dd);
        }
        out.append(dl);
      } catch (e) {
        const p = document.createElement("p");
        p.className = "err";
        p.textContent = "Backend nedostupný (" + e.message + ").";
        out.append(p);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: demo-prod
  namespace: argocd
spec:
  project: default
  source: 
    repoURL: https://github.com/samuel10998/k8s-platform-demo.git
    targetRevision: main-bonus
    path: charts/demo-app
    helm:
      releaseName: demo
      valueFiles:
       - values-prod.yaml
      
  destination: 
    server: https://kubernetes.default.svc
    namespace: demo-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
